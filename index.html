<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sales dashboard that reads a Google Sheet live.">
<title>Sales Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: filter bar on top, ruled KPI strip, one wide trend panel, three ranked-bar panels, transaction table. */
:root{
  --bg:#EFF3F6; --surface:#FFFFFF; --ink:#12202B; --muted:#566876;
  --grid:#DAE2E8; --border:#CFD9E0; --accent:#0B6E99; --accent-soft:#0B6E99;
  --ok:#1E8E5A; --warn:#A8690B; --bad:#B3261E; --notice-bg:#FFF6E5;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161D; --surface:#142029; --ink:#E4EDF3; --muted:#8FA3B2;
    --grid:#243441; --border:#2B3B49; --accent:#5CB8E0; --accent-soft:#5CB8E0;
    --ok:#4CC28A; --warn:#E0A93B; --bad:#F2766E; --notice-bg:#2A2412; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161D; --surface:#142029; --ink:#E4EDF3; --muted:#8FA3B2;
  --grid:#243441; --border:#2B3B49; --accent:#5CB8E0; --accent-soft:#5CB8E0;
  --ok:#4CC28A; --warn:#E0A93B; --bad:#F2766E; --notice-bg:#2A2412; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-inline:clamp(16px,4vw,40px);padding-block:28px 56px}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-end}
.head-l{min-width:0}
.eyebrow{margin:0 0 4px;font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:700 clamp(28px,5vw,40px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.status{margin:8px 0 0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok)} .dot.wait{background:var(--warn)} .dot.err{background:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.controls label{display:flex;flex-direction:column;gap:3px;font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,button{font:500 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;min-height:36px}
select{min-width:130px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.primary:hover:not(:disabled){color:var(--surface);opacity:.9}
:is(select,button):focus-visible,.hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{border:1px solid var(--warn);background:var(--notice-bg);border-radius:6px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.notice p{margin:0;min-width:0;flex:1 1 280px}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-block:1px solid var(--border)}
.kpi{padding:16px 20px 16px 0;min-width:0}
.kpi + .kpi{padding-left:20px;border-left:1px solid var(--border)}
.kpi .k{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{margin-top:6px;font:700 clamp(24px,3.4vw,32px)/1.1 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{margin-top:4px;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){
  .kpi,.kpi + .kpi{padding:14px 0;border-left:0}
  .kpi + .kpi{border-top:1px solid var(--border)}
}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;min-width:0}
.panel h2{margin:0;font:600 15px/1.3 var(--f-display);letter-spacing:-.005em}
.panel .sub{margin:2px 0 12px;color:var(--muted);font-size:12.5px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.grid3 .panel{display:flex;flex-direction:column;gap:12px}
.grid3 h2{margin:0}
#trend{width:100%;min-height:200px}
#trend svg{display:block;max-width:100%}
.ax{font:400 11px var(--f-mono);fill:var(--muted)}
.empty{margin:0;padding:28px 0;color:var(--muted);text-align:center;font-size:13px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(64px,92px) 1fr auto;gap:10px;align-items:center;min-height:26px;padding-block:1px;border-radius:4px}
.bar:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.bt{height:12px;display:block;min-width:0}
.bf{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;transition:width .35s ease}
.bv{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:58px}
.tbl-wrap{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{font-family:var(--f-mono);font-size:13px}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:var(--muted);font-size:12.5px}
#tip{position:fixed;z-index:10;pointer-events:none;max-width:260px;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#tip b{font-weight:600}
#tip .m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#tip .note{opacity:.75}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="head-l">
      <p class="eyebrow">dashboard demo · Sheet1</p>
      <h1>Sales Pulse</h1>
      <p class="status" role="status"><span class="dot wait" id="dot"></span><span id="status">Connecting to Google Sheets…</span></p>
    </div>
    <div class="controls">
      <label for="fRegion">Region<select id="fRegion"><option value="">All regions</option></select></label>
      <label for="fProduct">Product<select id="fProduct"><option value="">All products</option></select></label>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main>
    <section class="kpis" id="kpis" aria-label="Key figures"></section>

    <section class="panel">
      <h2>Revenue over time</h2>
      <p class="sub" id="trendSub">Waiting for data</p>
      <div id="trend"></div>
    </section>

    <div class="grid3">
      <section class="panel"><h2>Revenue by region</h2><div class="bars" id="bRegion"></div></section>
      <section class="panel"><h2>Revenue by product</h2><div class="bars" id="bProduct"></div></section>
      <section class="panel"><h2>Revenue by salesperson</h2><div class="bars" id="bRep"></div></section>
    </div>

    <section class="panel">
      <h2>Transactions</h2>
      <p class="sub" id="tblSub">Newest first</p>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Date</th><th>Region</th><th>Product</th><th>Salesperson</th><th class="n">Units</th><th class="n">Unit price</th><th class="n">Revenue</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="tbl-foot"><span id="tblCount"></span><button id="tblToggle" type="button" hidden>Show all</button></div>
    </section>
  </main>
</div>
<div id="tip" role="tooltip" hidden></div>

<script>
(function(){
'use strict';
var SERVER='Google Sheets';
var INPUT={spreadsheetId:'1-FtSvErtHgDW79yIvYFaTV56Cnx1tb7Pt7u2im0kV1Q',range:'Sheet1!A:G'};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var inr=new Intl.NumberFormat('en-IN');
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '₹'+inr.format(Math.round(n));}
function t1(x){return String(Math.round(x*10)/10);}
function compact(n){var a=Math.abs(n);return a>=1e7?'₹'+t1(n/1e7)+' Cr':a>=1e5?'₹'+t1(n/1e5)+' L':a>=1e3?'₹'+t1(n/1e3)+'K':'₹'+Math.round(n);}
function dayFmt(ms,withYear){var d=new Date(ms);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+(withYear?' '+d.getUTCFullYear():'');}

/* ---------- parsing ---------- */
function parseDate(v){
  var s=String(v==null?'':v).trim(); if(!s) return null; var m;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return Date.UTC(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3})[a-z]*[\s\-\/,]*(\d{4})/);
  if(m){var mo=MON.findIndex(function(x){return x.toLowerCase()===m[2].toLowerCase();}); if(mo>=0) return Date.UTC(+m[3],mo,+m[1]);}
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m) return Date.UTC(+m[3],+m[2]-1,+m[1]);
  var t=Date.parse(s); if(!isNaN(t)){var d=new Date(t);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());}
  return null;
}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;}
function parseSheet(values){
  if(!Array.isArray(values)||!values.length) return {rows:[],err:'empty'};
  var head=(values[0]||[]).map(function(h){return String(h||'').trim().toLowerCase();});
  function idx(k){return head.findIndex(function(h){return h.indexOf(k)===0;});}
  var c={date:idx('date'),region:idx('region'),product:idx('product'),rep:idx('salesperson'),units:idx('units'),price:idx('unit price'),rev:idx('revenue')};
  if(c.date<0||c.region<0||c.product<0||c.units<0||(c.rev<0&&c.price<0)) return {rows:[],err:'columns'};
  var rows=[];
  for(var i=1;i<values.length;i++){
    var r=values[i]||[]; var d=parseDate(r[c.date]); var units=num(r[c.units]);
    var price=c.price>=0?num(r[c.price]):null; var rev=c.rev>=0?num(r[c.rev]):null;
    if(rev==null&&units!=null&&price!=null) rev=units*price;
    if(d==null||rev==null) continue;
    rows.push({d:d,region:String(r[c.region]||'').trim()||'Unassigned',product:String(r[c.product]||'').trim()||'Unassigned',
      rep:c.rep>=0?(String(r[c.rep]||'').trim()||'Unassigned'):'Unassigned',units:units||0,price:price,rev:rev});
  }
  return {rows:rows,err:rows.length?null:'empty'};
}

/* ---------- state ---------- */
var mcp=null, unsub=null, rows=[], loadedAt=null, loadErr=null, parseErr=null, refreshing=false, showAll=false;
var lastBuckets=[], lastTrendW=0;

function group(list,key){
  var m={}; list.forEach(function(r){var k=r[key]; var g=m[k]||(m[k]={label:k,rev:0,units:0,orders:0}); g.rev+=r.rev;g.units+=r.units;g.orders++;});
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.rev-a.rev;});
}

/* ---------- tooltip ---------- */
var tip=$('tip');
function showTip(html,x,y){
  tip.innerHTML=html; tip.hidden=false;
  var w=tip.offsetWidth,h=tip.offsetHeight,vw=document.documentElement.clientWidth;
  var left=x+14; if(left+w>vw-8) left=x-w-14; if(left<8) left=8;
  var top=y-h-12; if(top<8) top=y+16;
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function hideTip(){tip.hidden=true;}

/* ---------- renderers ---------- */
function renderKpis(list){
  var el=$('kpis');
  if(!list.length){
    el.innerHTML=['Revenue','Units sold','Average order','Top region'].map(function(k){return '<div class="kpi"><div class="k">'+k+'</div><div class="v">–</div><div class="s">&nbsp;</div></div>';}).join('');
    return;
  }
  var rev=0,units=0; list.forEach(function(r){rev+=r.rev;units+=r.units;});
  var reg=group(list,'region')[0], prod=group(list,'product')[0];
  var items=[
    ['Revenue',money(rev),list.length+' orders'],
    ['Units sold',inr.format(units),'Best seller: '+esc(prod.label)],
    ['Average order',money(rev/list.length),'per order'],
    ['Top region',esc(reg.label),Math.round(reg.rev/rev*100)+'% of revenue']
  ];
  el.innerHTML=items.map(function(i){return '<div class="kpi"><div class="k">'+i[0]+'</div><div class="v">'+i[1]+'</div><div class="s">'+i[2]+'</div></div>';}).join('');
}

function bars(id,list,total){
  var el=$(id);
  if(!list.length){el.innerHTML='<p class="empty">No data yet</p>';el.onpointermove=null;return;}
  var max=list[0].rev||1;
  el.innerHTML=list.map(function(it,i){
    var share=total?Math.round(it.rev/total*100):0;
    return '<div class="bar" data-i="'+i+'" role="img" aria-label="'+esc(it.label)+': '+money(it.rev)+', '+share+'% of revenue">'+
      '<span class="bl" title="'+esc(it.label)+'">'+esc(it.label)+'</span>'+
      '<span class="bt"><span class="bf" style="width:'+Math.max(1,it.rev/max*100)+'%"></span></span>'+
      '<span class="bv">'+compact(it.rev)+'</span></div>';
  }).join('');
  el.onpointermove=function(e){
    var r=e.target.closest('.bar'); if(!r){hideTip();return;}
    var it=list[+r.dataset.i]; var share=total?Math.round(it.rev/total*100):0;
    showTip('<b>'+esc(it.label)+'</b><br><span class="m">'+money(it.rev)+'</span> · '+share+'% of revenue<br><span class="note">'+inr.format(it.units)+' units · '+it.orders+' orders</span>',e.clientX,e.clientY);
  };
  el.onpointerleave=hideTip;
}

function niceCeil(x){
  if(x<=0) return 1; var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)); var f=x/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
function buildBuckets(list){
  if(!list.length) return {buckets:[],mode:'week'};
  var min=Infinity,max=-Infinity; list.forEach(function(r){if(r.d<min)min=r.d;if(r.d>max)max=r.d;});
  var span=(max-min)/864e5, mode=span>150?'month':'week', DAY=864e5;
  function start(ms){var d=new Date(ms); if(mode==='week') return ms-((d.getUTCDay()+6)%7)*DAY; return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);}
  function next(ms){if(mode==='week') return ms+7*DAY; var d=new Date(ms); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1);}
  var buckets=[],map={};
  for(var s=start(min);s<=max;s=next(s)){var b={start:s,rev:0,units:0,orders:0};buckets.push(b);map[s]=b;}
  list.forEach(function(r){var b=map[start(r.d)]; if(b){b.rev+=r.rev;b.units+=r.units;b.orders++;}});
  var last=buckets[buckets.length-1];
  last.partial = mode==='week' ? max<last.start+6*DAY : max<next(last.start)-DAY;
  buckets.forEach(function(b){
    b.label = mode==='week' ? 'Week of '+dayFmt(b.start,true) : MON[new Date(b.start).getUTCMonth()]+' '+new Date(b.start).getUTCFullYear();
    b.short = mode==='week' ? dayFmt(b.start,false) : MON[new Date(b.start).getUTCMonth()]+' '+String(new Date(b.start).getUTCFullYear()).slice(2);
  });
  return {buckets:buckets,mode:mode};
}
function renderTrend(buckets,mode){
  var el=$('trend');
  if(!buckets.length){el.innerHTML='<p class="empty">No data yet</p>';return;}
  var W=Math.max(280,el.clientWidth), H=W<500?210:260, n=buckets.length;
  lastTrendW=W;
  var m={l:W<500?46:58,r:22,t:22,b:28}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  function X(i){return m.l+(n===1?iw/2:i*iw/(n-1));}
  var maxV=1; buckets.forEach(function(b){if(b.rev>maxV)maxV=b.rev;});
  var step=niceCeil(maxV/4), ymax=step*Math.ceil(maxV/step);
  function Y(v){return m.t+ih-(v/ymax)*ih;}
  var s='<svg id="tsvg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Revenue per '+mode+', '+n+' periods, highest '+compact(maxV)+'">';
  for(var v=0;v<=ymax+1e-6;v+=step){
    s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)" stroke-width="1"/>';
    s+='<text class="ax" x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(v===0?'₹0':compact(v))+'</text>';
  }
  var maxLabels=Math.max(2,Math.floor(iw/64)), stride=Math.ceil(n/maxLabels);
  buckets.forEach(function(b,i){
    if(i%stride===0) s+='<text class="ax" x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(b.short)+'</text>';
  });
  var pts=buckets.map(function(b,i){return [X(i),Y(b.rev)];});
  var partial=buckets[n-1].partial&&n>1;
  var solid=partial?pts.slice(0,n-1):pts;
  var base=Y(0);
  if(n>1){
    s+='<path d="M'+pts[0][0]+','+base+' '+pts.map(function(p){return 'L'+p[0]+','+p[1];}).join(' ')+' L'+pts[n-1][0]+','+base+' Z" fill="var(--accent)" fill-opacity=".12"/>';
    if(solid.length>1) s+='<path d="'+solid.map(function(p,i){return (i?'L':'M')+p[0]+','+p[1];}).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if(partial) s+='<path d="M'+pts[n-2][0]+','+pts[n-2][1]+' L'+pts[n-1][0]+','+pts[n-1][1]+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>';
  }
  var pi=0; buckets.forEach(function(b,i){if(b.rev>buckets[pi].rev)pi=i;});
  buckets.forEach(function(b,i){ if(i!==n-1) s+='<circle cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'; });
  s+='<circle cx="'+pts[n-1][0]+'" cy="'+pts[n-1][1]+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  var px=Math.min(Math.max(pts[pi][0],m.l+22),W-m.r-22);
  s+='<text class="ax" style="fill:var(--ink);font-weight:500" x="'+px+'" y="'+(pts[pi][1]-10)+'" text-anchor="middle">'+compact(buckets[pi].rev)+'</text>';
  s+='<line id="xh" y1="'+m.t+'" y2="'+base+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>';
  s+='<circle id="xc" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>';
  s+='<rect class="hit" x="'+(m.l-10)+'" y="0" width="'+(iw+20)+'" height="'+H+'" fill="transparent"/>';
  s+='</svg>';
  el.innerHTML=s;
  var svg=$('tsvg'), xh=$('xh'), xc=$('xc');
  function move(e){
    var rect=svg.getBoundingClientRect(); var x=e.clientX-rect.left;
    var i=n===1?0:Math.round((x-m.l)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i));
    var b=buckets[i];
    xh.setAttribute('x1',pts[i][0]);xh.setAttribute('x2',pts[i][0]);xh.setAttribute('visibility','visible');
    xc.setAttribute('cx',pts[i][0]);xc.setAttribute('cy',pts[i][1]);xc.setAttribute('visibility','visible');
    showTip('<b>'+esc(b.label)+'</b><br><span class="m">'+money(b.rev)+'</span><br><span class="note">'+inr.format(b.units)+' units · '+b.orders+' orders'+(b.partial?' · period still running':'')+'</span>',e.clientX,e.clientY);
  }
  function leave(){hideTip();xh.setAttribute('visibility','hidden');xc.setAttribute('visibility','hidden');}
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move); svg.addEventListener('pointerleave',leave);
}

function renderTable(list){
  var sorted=list.slice().sort(function(a,b){return b.d-a.d;});
  var limit=showAll?sorted.length:10, shown=sorted.slice(0,limit);
  $('tbody').innerHTML=shown.length?shown.map(function(r){
    return '<tr><td>'+dayFmt(r.d,true)+'</td><td>'+esc(r.region)+'</td><td>'+esc(r.product)+'</td><td>'+esc(r.rep)+'</td>'+
      '<td class="n">'+inr.format(r.units)+'</td><td class="n">'+(r.price==null?'–':money(r.price))+'</td><td class="n">'+money(r.rev)+'</td></tr>';
  }).join(''):'<tr><td colspan="7"><p class="empty">No rows to show yet</p></td></tr>';
  $('tblCount').textContent=sorted.length?'Showing '+shown.length+' of '+sorted.length:'';
  var tg=$('tblToggle'); tg.hidden=sorted.length<=10; tg.textContent=showAll?'Show latest 10':'Show all '+sorted.length;
}

function fillSelect(id,values,allLabel){
  var sel=$(id), cur=sel.value;
  sel.innerHTML='<option value="">'+allLabel+'</option>'+values.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join('');
  sel.value=values.indexOf(cur)>=0?cur:'';
}
function setStatus(text,kind){$('status').textContent=text;$('dot').className='dot '+(kind||'');}

function render(){
  fillSelect('fRegion',group(rows,'region').map(function(g){return g.label;}).sort(),'All regions');
  fillSelect('fProduct',group(rows,'product').map(function(g){return g.label;}).sort(),'All products');
  var fr=$('fRegion').value, fp=$('fProduct').value;
  var list=rows.filter(function(r){return (!fr||r.region===fr)&&(!fp||r.product===fp);});
  renderKpis(list);
  var total=0; list.forEach(function(r){total+=r.rev;});
  bars('bRegion',group(list,'region'),total);
  bars('bProduct',group(list,'product'),total);
  bars('bRep',group(list,'rep'),total);
  var tb=buildBuckets(list); lastBuckets=tb;
  renderTrend(tb.buckets,tb.mode);
  $('trendSub').textContent=list.length?(tb.mode==='week'?'Weekly totals, weeks start Monday':'Monthly totals')+(tb.buckets.length&&tb.buckets[tb.buckets.length-1].partial?'. Dashed segment: period still running':''):(rows.length?'No rows match these filters':'Waiting for data');
  renderTable(list);
  if(rows.length){
    var t=loadedAt?new Date(loadedAt).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'';
    if(loadErr) setStatus('Showing the last data from Google Sheets'+(t?' ('+t+')':'')+'. Retrying automatically.','wait');
    else setStatus('Live from Google Sheets · '+rows.length+' rows · updated '+t,'live');
  }
}

/* ---------- notices ---------- */
function notice(text,btnLabel,onBtn){
  var n=$('notice'); n.hidden=false;
  n.innerHTML='<p>'+text+'</p>'+(btnLabel?'<button type="button" class="primary" id="noticeBtn">'+btnLabel+'</button>':'');
  if(btnLabel) $('noticeBtn').onclick=onBtn;
}
function clearNotice(){$('notice').hidden=true;$('notice').innerHTML='';}

/* ---------- data handling ---------- */
function onResult(res){
  refreshing=false; $('refresh').disabled=false;
  var p=res&&res.payload;
  if(typeof p==='string'){try{p=JSON.parse(p);}catch(e){p=null;}}
  var parsed=parseSheet((p&&p.values)||[]);
  loadErr=null; parseErr=parsed.err;
  rows=parsed.rows;
  loadedAt=(res&&res.cache&&res.cache.storedAt)||Date.now();
  if(parsed.err==='columns'){
    notice('Could not find the expected columns in Sheet1. The first row needs Date, Region, Product, Salesperson, Units, Unit Price and Revenue.');
    setStatus('Connected, but the sheet layout is not recognised','err');
  } else if(parsed.err==='empty'){
    clearNotice();
    setStatus('Connected to Google Sheets. The sheet has no rows yet.','wait');
  } else clearNotice();
  render();
}
var SHEET_URL='https://docs.google.com/spreadsheets/d/1-FtSvErtHgDW79yIvYFaTV56Cnx1tb7Pt7u2im0kV1Q/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent('Sheet1');
function parseCSV(t){
  var out=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cur);cur=''; out.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);out.push(row);}
  return out;
}
function onError(err){
  refreshing=false; $('refresh').disabled=false;
  loadErr='net';
  if(!rows.length){
    notice('Could not read the Google Sheet. In Google Sheets, choose Share, then set General access to "Anyone with the link" (Viewer), and press Refresh.');
    setStatus('Not connected to Google Sheets','err');
  }
  render();
}
function load(){
  return fetch(SHEET_URL,{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(t){ onResult({payload:{values:parseCSV(t)}}); })
    .catch(onError);
}
$('fRegion').addEventListener('change',render);
$('fProduct').addEventListener('change',render);
$('tblToggle').addEventListener('click',function(){showAll=!showAll;render();});
$('refresh').addEventListener('click',function(){
  refreshing=true; $('refresh').disabled=true; setStatus('Refreshing from Google Sheets…','wait');
  load();
});
var raf=0;
if(window.ResizeObserver){
  new ResizeObserver(function(){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(function(){
      var w=Math.max(280,$('trend').clientWidth);
      if(Math.abs(w-lastTrendW)>2&&lastBuckets&&lastBuckets.buckets) renderTrend(lastBuckets.buckets,lastBuckets.mode);
    });
  }).observe($('trend'));
}
render();
setStatus('Connecting to Google Sheets…','wait');
load();
setInterval(function(){ if(!document.hidden) load(); },30000);
})();
</script>
